<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D6C60" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1312" media="(prefers-color-scheme: dark)">
<meta name="description" content="輸入電表起訖度數，自動算出房租電費總額，一鍵複製給房東的訊息。">
<title>房租訊息產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
  :root {
    --ground: #EDF1F0;
    --card: #FFFFFF;
    --ink: #101F1D;
    --ink-soft: #576966;
    --ink-faint: #8A9B98;
    --line: #D8DFDD;
    --accent: #0D6C60;
    --accent-soft: #E1EEEB;
    --total: #A9491A;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(16, 31, 29, .05), 0 8px 24px -12px rgba(16, 31, 29, .18);

    /* LCD panel — deliberately the same in both themes */
    --lcd: #0A100F;
    --lcd-edge: #1E2B29;
    --lcd-ink: #6FE0C8;
    --lcd-dim: #3C6C63;

    --sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    --serif: "Noto Serif TC", Georgia, "Songti TC", serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0D1312;
      --card: #161F1D;
      --ink: #E6EDEB;
      --ink-soft: #94A6A3;
      --ink-faint: #6F817E;
      --line: #263230;
      --accent: #4FC0AB;
      --accent-soft: #17322D;
      --total: #E4A275;
      --on-accent: #06100E;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0D1312;
    --card: #161F1D;
    --ink: #E6EDEB;
    --ink-soft: #94A6A3;
    --ink-faint: #6F817E;
    --line: #263230;
    --accent: #4FC0AB;
    --accent-soft: #17322D;
    --total: #E4A275;
    --on-accent: #06100E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 128px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { display: flex; flex-direction: column; gap: 6px; padding: 0 2px 4px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 27px;
    line-height: 1.25;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }

  .sub { margin: 0; font-size: 13.5px; color: var(--ink-soft); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }
  .card-label span:last-child {
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: .02em;
  }

  /* ---- LCD meter panel ---- */
  .lcd {
    background: var(--lcd);
    border: 1px solid var(--lcd-edge);
    border-radius: 10px;
    padding: 14px 12px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
  }

  .reading { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  .reading > label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .16em;
    color: var(--lcd-dim);
    padding-left: 2px;
  }

  .reading input {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--lcd-edge);
    padding: 2px 2px 5px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 25px;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    color: var(--lcd-ink);
    text-shadow: 0 0 14px rgba(111, 224, 200, .35);
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .reading input::placeholder { color: #24413C; text-shadow: none; }
  .reading input:focus {
    outline: none;
    border-bottom-color: var(--lcd-ink);
  }
  .reading input:focus-visible { border-bottom-width: 2px; padding-bottom: 4px; }

  .arrow {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--lcd-dim);
    padding-top: 16px;
  }

  .usage {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .chip.warn { background: rgba(180, 83, 31, .12); color: var(--total); }

  .tiny { font-size: 12.5px; color: var(--ink-faint); }

  /* ---- receipt ---- */
  .rows { display: flex; flex-direction: column; gap: 9px; }

  .row { display: flex; align-items: baseline; gap: 6px; font-size: 14.5px; }
  .row .name { color: var(--ink-soft); white-space: nowrap; }
  .row .dots { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-4px); }
  .row .val {
    font-family: var(--mono);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 2px;
  }
  .total .name { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--ink-faint); }
  .total .val {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 33px;
    line-height: 1;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    color: var(--total);
  }
  .total .val small { font-family: var(--sans); font-size: 14px; font-weight: 500; margin-left: 3px; }

  /* ---- message bubble ---- */
  .bubble {
    background: var(--accent-soft);
    border-radius: 4px 14px 14px 14px;
    padding: 13px 14px;
    font-size: 14.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
    min-height: 60px;
  }
  .bubble.empty { color: var(--ink-faint); }

  .switch {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .switch input {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    width: 40px;
    height: 23px;
    flex: 0 0 auto;
    border-radius: 99px;
    background: var(--line);
    border: 0;
    position: relative;
    cursor: pointer;
    transition: background .18s ease;
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .18s ease;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(17px); }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- settings ---- */
  details.settings {
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 0 14px;
    background: transparent;
  }
  details.settings summary {
    cursor: pointer;
    list-style: none;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::before {
    content: "＋";
    font-family: var(--mono);
    color: var(--accent);
  }
  details.settings[open] summary::before { content: "－"; }
  details.settings summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .fields { display: flex; gap: 12px; padding: 0 0 14px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; letter-spacing: .08em; color: var(--ink-faint); }
  .field input {
    width: 100%;
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 16px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---- sticky action ---- */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--ground) 62%, rgba(0,0,0,0));
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .dock-inner { width: 100%; max-width: 404px; pointer-events: auto; }

  button.copy {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 15px 18px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    box-shadow: 0 6px 20px -8px rgba(13, 108, 96, .6);
    transition: transform .12s ease, background .18s ease, opacity .18s ease;
  }
  button.copy:active { transform: scale(.985); }
  button.copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button.copy:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  button.copy.done { background: var(--total); box-shadow: none; }

  footer { text-align: center; font-size: 12px; color: var(--ink-faint); padding-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">每月 5 號 · 傳給房東</div>
    <h1>房租訊息產生器</h1>
    <p class="sub">輸入電表起訖度數，自動算好電費與總額，一鍵複製整段訊息。</p>
  </header>

  <section class="card">
    <div class="card-label"><span>電表讀數</span><span id="rateNote">每度 5 元</span></div>

    <div class="lcd">
      <div class="reading">
        <label for="start">上期</label>
        <input id="start" type="text" inputmode="numeric" autocomplete="off" placeholder="24070"
               aria-label="上期電表度數">
      </div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="reading">
        <label for="end">本期</label>
        <input id="end" type="text" inputmode="numeric" autocomplete="off" placeholder="24188"
               aria-label="本期電表度數">
      </div>
    </div>

    <div class="usage">
      <span class="chip" id="usageChip">尚未輸入度數</span>
      <span class="tiny" id="hint">可直接貼上「24070-24188」</span>
    </div>
  </section>

  <section class="card">
    <div class="card-label"><span>本月明細</span></div>
    <div class="rows">
      <div class="row">
        <span class="name">房租</span><span class="dots"></span>
        <span class="val" id="rentVal">8,500</span>
      </div>
      <div class="row">
        <span class="name">電費</span><span class="dots"></span>
        <span class="val" id="elecVal">—</span>
      </div>
    </div>
    <div class="total">
      <span class="name">應付總額</span>
      <span class="val" id="totalVal">—<small>元</small></span>
    </div>
  </section>

  <section class="card">
    <div class="card-label"><span>訊息預覽</span></div>
    <div class="bubble empty" id="preview">填入度數後，這裡會出現要傳給房東的訊息。</div>
    <label class="switch">
      <input type="checkbox" id="bankToggle">
      <span>附上將來銀行匯款通知文字</span>
    </label>
  </section>

  <details class="settings">
    <summary>調整房租與電價</summary>
    <div class="fields">
      <div class="field">
        <label for="rent">房租（元）</label>
        <input id="rent" type="text" inputmode="numeric" autocomplete="off" value="8500">
      </div>
      <div class="field">
        <label for="rate">電價（元／度）</label>
        <input id="rate" type="text" inputmode="decimal" autocomplete="off" value="5">
      </div>
    </div>
  </details>

  <footer id="memory">本期度數會記在這台裝置，下個月自動帶入上期。</footer>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="copy" id="copyBtn" disabled>複製訊息</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var startEl = $('start'), endEl = $('end'), rentEl = $('rent'), rateEl = $('rate');
  var bankEl = $('bankToggle'), copyBtn = $('copyBtn'), preview = $('preview');
  var usageChip = $('usageChip'), hint = $('hint'), rateNote = $('rateNote');
  var rentVal = $('rentVal'), elecVal = $('elecVal'), totalVal = $('totalVal'), memory = $('memory');

  var KEY = 'rent-msg-v1';
  var store = {
    get: function () {
      try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
    },
    set: function (obj) {
      try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {}
    }
  };

  // 全形數字、全形符號、空白、各種破折號 → 半形
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[－～–—〜（）~到至－_]/g, '-')
      .replace(/\s|,|，/g, '');
  }

  function digits(s) {
    var m = normalize(s).replace(/[^\d.]/g, '');
    return m;
  }

  function num(s, fallback) {
    var v = parseFloat(digits(s));
    return isFinite(v) ? v : fallback;
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('en-US');
  }

  // 貼上「24070-24188」時自動拆成兩欄
  function trySplit(el, other) {
    var raw = normalize(el.value);
    var parts = raw.split('-').filter(function (p) { return /\d/.test(p); });
    if (parts.length >= 2) {
      startEl.value = parts[0].replace(/\D/g, '');
      endEl.value = parts[1].replace(/\D/g, '');
      return true;
    }
    var clean = raw.replace(/\D/g, '');
    if (el.value !== clean) el.value = clean;
    return false;
  }

  var swapped = false;

  function compute() {
    var rent = num(rentEl.value, 8500);
    var rate = num(rateEl.value, 5);
    var a = digits(startEl.value), b = digits(endEl.value);
    var ok = a !== '' && b !== '';
    var s = parseInt(a, 10), e = parseInt(b, 10);

    rateNote.textContent = '每度 ' + (Math.round(rate * 100) / 100) + ' 元';
    rentVal.textContent = fmt(rent);

    swapped = false;
    if (ok && s > e) { var t = s; s = e; e = t; swapped = true; }

    if (!ok) {
      usageChip.className = 'chip';
      usageChip.textContent = '尚未輸入度數';
      hint.textContent = '可直接貼上「24070-24188」';
      elecVal.textContent = '—';
      totalVal.innerHTML = '—<small>元</small>';
      preview.className = 'bubble empty';
      preview.textContent = '填入度數後，這裡會出現要傳給房東的訊息。';
      copyBtn.disabled = true;
      copyBtn.className = 'copy';
      copyBtn.textContent = '複製訊息';
      return null;
    }

    var used = e - s;
    var elec = Math.round(used * rate);
    var total = Math.round(rent) + elec;

    usageChip.className = 'chip' + (used === 0 ? ' warn' : '');
    usageChip.textContent = '用電 ' + fmt(used) + ' 度 × ' + (Math.round(rate * 100) / 100) + ' 元 = ' + fmt(elec) + ' 元';
    hint.textContent = swapped ? '已自動把大小順序調正' : '';

    elecVal.textContent = fmt(elec);
    totalVal.innerHTML = fmt(total) + '<small>元</small>';

    var msg = '房東好，本月房租：' + Math.round(rent) + '+電費 ' + elec + '元（' + s + '-' + e + '），共 ' + total + '元，已匯款 ' + total + '請確認。';
    if (bankEl.checked) {
      msg += '\n\nHi，我已經從 823 將來銀行(帳號末五碼69057)，轉帳NT$' + fmt(total) + '元給你囉，請查詢交易明細！';
    }

    preview.className = 'bubble';
    preview.textContent = msg;
    copyBtn.disabled = false;
    if (copyBtn.className.indexOf('done') === -1) copyBtn.textContent = '複製訊息';

    return { msg: msg, end: e };
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      } catch (err) { reject(err); }
    });
  }

  copyBtn.addEventListener('click', function () {
    var r = compute();
    if (!r) return;
    copyText(r.msg).then(function () {
      copyBtn.className = 'copy done';
      copyBtn.textContent = '已複製，貼給房東吧';
      var st = store.get();
      st.lastEnd = r.end;
      st.rent = digits(rentEl.value);
      st.rate = digits(rateEl.value);
      store.set(st);
      memory.textContent = '已記住本期 ' + r.end + ' 度，下個月會自動帶入上期。';
      setTimeout(function () {
        copyBtn.className = 'copy';
        copyBtn.textContent = '複製訊息';
      }, 2200);
    }).catch(function () {
      copyBtn.textContent = '複製失敗，請長按訊息手動複製';
      setTimeout(function () { copyBtn.textContent = '複製訊息'; }, 2600);
    });
  });

  startEl.addEventListener('input', function () { trySplit(startEl); compute(); });
  endEl.addEventListener('input', function () { trySplit(endEl); compute(); });
  [rentEl, rateEl, bankEl].forEach(function (el) {
    el.addEventListener('input', compute);
    el.addEventListener('change', compute);
  });

  // 從裝置記憶帶入
  var saved = store.get();
  if (saved.rent) rentEl.value = saved.rent;
  if (saved.rate) rateEl.value = saved.rate;
  if (saved.lastEnd) {
    startEl.value = saved.lastEnd;
    memory.textContent = '已帶入上次紀錄的 ' + saved.lastEnd + ' 度作為上期。';
    endEl.focus({ preventScroll: true });
  }
  compute();
})();
</script>
</body>
</html>
