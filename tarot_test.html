<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 停用瀏覽器快取設定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>✨ 塔羅心靈測驗：找出你的決策盲點與命定書 ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFF5F7;
      --card-bg: #FFFFFF;
      --primary: #FFB7B2;
      --primary-hover: #FF9AA2;
      --accent: #E2F0CB;
      --accent-pink: #FFE5E5;
      --text-main: #5C4B69;
      --text-soft: #887B97;
      --shadow: 0 10px 25px rgba(255, 183, 178, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 版本號標籤 */
    .version-tag {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 0.75rem;
      color: var(--text-soft);
      background-color: #F0E6EE;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 12px rgba(255, 154, 162, 0.4);
      width: 100%;
      margin-top: 12px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* 清除快取按鈕 */
    .btn-clear {
      background: none;
      border: 1px dashed var(--text-soft);
      color: var(--text-soft);
      padding: 8px 16px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background-color: #FFF0F3;
      color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .progress-bar {
      height: 8px;
      background-color: var(--accent-pink);
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.6;
      font-weight: bold;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #FAF0F2;
      border: 2px solid transparent;
      padding: 14px 16px;
      border-radius: 18px;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover {
      background-color: #FFEBEF;
      border-color: var(--primary);
      transform: translateX(4px);
    }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .result-tag {
      display: inline-block;
      background-color: var(--accent);
      color: #4A5D23;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .result-section {
      background-color: #FAF0F2;
      border-radius: 20px;
      padding: 18px;
      text-align: left;
      margin: 14px 0;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .result-section h3 {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .book-list {
      margin-top: 8px;
      padding-left: 18px;
    }

    .book-list li {
      margin-bottom: 6px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 版本號標籤 -->
  <div class="version-tag">v1.2.1</div>

  <!-- 開始頁面 -->
  <div id="start-screen">
    <div class="card-icon">🔮</div>
    <h1>塔羅靈魂測驗</h1>
    <p class="subtitle">每次做決定都陷入內耗嗎？<br>5 題揭開你的決策潛意識，為你送上一份治癒心靈的解藥書單卡！</p>
    <button class="btn" onclick="startQuiz()">開啟測驗 ✨</button>
    <div>
      <button class="btn-clear" onclick="clearCacheAndReload()">🧹 重置快取 (Clear Cache)</button>
    </div>
  </div>

  <!-- 測驗頁面 -->
  <div id="quiz-screen" class="hidden">
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    <div class="question-title" id="question-text">題目載入中...</div>
    <div class="options" id="options-container"></div>
  </div>

  <!-- 結果頁面 -->
  <div id="result-screen" class="hidden">
    <div class="card-icon" id="result-icon">🃏</div>
    <div class="result-tag" id="result-tag">原型名稱</div>
    <h1 id="result-title">你的塔羅牌</h1>
    
    <div class="result-box">
      <div class="result-section">
        <h3>🌸 深度心理剖析</h3>
        <p id="result-psychology">心理分析加載中...</p>
      </div>

      <div class="result-section" style="background-color: #FFF0F3; border: 1px solid #FFD6E0;">
        <h3>✨ 給你的溫柔解藥</h3>
        <p id="result-warm-notes">溫柔評語加載中...</p>
      </div>

      <div class="result-section" style="background-color: #F0F7EC;">
        <h3>📚 命定閱讀書單推薦</h3>
        <ul class="book-list" id="result-books"></ul>
      </div>
    </div>

    <button class="btn" onclick="restartQuiz()">再測一次 🔄</button>
    <div>
      <button class="btn-clear" onclick="clearCacheAndReload()">🧹 重置快取 (Clear Cache)</button>
    </div>
  </div>
</div>

<script>
  // 清除快取、Cookie 並重新載入
  function clearCacheAndReload() {
    localStorage.clear();
    sessionStorage.clear();

    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i];
      const eqPos = cookie.indexOf("=");
      const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
      document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    }

    alert("快取與 Cookie 已清除！頁面即將重整。");
    window.location.reload(true);
  }

  const questions = [
    {
      q: "1. 當你面對一個二選一的難題時，最常讓你卡住的原因是什麼？",
      options: [
        { text: "怕選了這個，之後會後悔沒選另一個（大腦一直跑平行時空劇場）", type: "A" },
        { text: "細節想太多、最壞打算列一堆，越想心越累", type: "B" },
        { text: "兩個優點我都想要，不想要被迫做任何放棄", type: "C" },
        { text: "怕選錯會影響到身邊人的心情或大家對我的評價", type: "D" }
      ]
    },
    {
      q: "2. 你平常做不出決定時，第一時間最想做什麼？",
      options: [
        { text: "狂爬文、看評測、做 Excel，想用理性說服自己", type: "A" },
        { text: "算命、求籤、抽塔羅，希望有某個宇宙訊號直接幫我指路", type: "B" },
        { text: "先放著不管，去吃美食或滑手機，用拖延來逃避選錯", type: "C" },
        { text: "問爆身邊的朋友：「如果是你，你會怎麼選？」", type: "D" }
      ]
    },
    {
      q: "3. 走進一家菜單有上百道菜的網美餐廳，你會怎麼點餐？",
      options: [
        { text: "冷靜地用排除法，挑出 CP 值最高或當下身體最需要的", type: "A" },
        { text: "猶豫不決卡很久，最後為了安全感，點跟上次一模一樣的", type: "B" },
        { text: "點名字看起來最特別、最具視覺吸引力的新品衝一波", type: "C" },
        { text: "直接點「主廚推薦」或大家最常點的招牌菜，最不踩雷", type: "D" }
      ]
    },
    {
      q: "4. 如果有人逼你 3 秒內做出一個重要決定，你的第一反應是？",
      options: [
        { text: "大腦快速高速轉動，憑直覺抓一個相對最沒風險的", type: "A" },
        { text: "腦袋瞬間一片空白，非常焦慮甚至很想逃跑", type: "B" },
        { text: "閉著眼睛隨便抓一個，但事後會念念不忘當初沒選的那個", type: "C" },
        { text: "感到生氣或委屈，覺得「為什麼要逼我承擔這個風險」", type: "D" }
      ]
    },
    {
      q: "5. 完成一個決定後，你最希望獲得什麼樣的感覺？",
      options: [
        { text: "掌控感！清楚知道下一步該怎麼走，路線超明確", type: "A" },
        { text: "安全感！鬆了一口氣，內心終於恢復平靜與安穩", type: "B" },
        { text: "新鮮感！覺得生活充滿可能，可以無拘無束去探索", type: "C" },
        { text: "認同感！身邊的人都覺得這個決定很好、很圓滿", type: "D" }
      ]
    }
  ];

  const results = {
    A: {
      icon: "🗡️",
      tag: "理性完美型",
      title: "【寶劍首牌】",
      psychology: "你的選擇困難不是因為沒想法，而是因為「太想選出最佳解」。你的大腦就像一台超載的超級電腦，企圖評估所有變數。這種過度思考（Analysis Paralysis）讓你以為多蒐集資訊就能避開風險，卻無意間消耗掉了所有執行力。",
      warmNotes: "親愛的，人生沒有絕對正確的選擇，只有『把選擇變成正確』的勇氣。偶爾允許自己選一個 70 分的選項，並相信自己有能力處理隨之而來的一切，你會發現鬆開緊握的手反而更自由。",
      books: [
        "<b>《你願意，人生就會值得》</b>（蔡康永）— 用輕盈高情商看待選擇，告別過度內耗。",
        "<b>《我可能錯了》</b>（比約恩）— 森林智者的最後一堂課，教你放鬆對理性的執念。",
        "<b>《原子習慣》</b>（詹姆斯·克利爾）— 忘掉完美決策，用簡單微小的行動打開開關。"
      ]
    },
    B: {
      icon: "🌙",
      tag: "焦慮避險型",
      title: "【月亮】",
      psychology: "選擇對你而言不是挑選事物，而是一場對抗「後悔與恐懼」的拉鋸戰。你內心那個敏感脆弱的小女孩，非常害怕選錯後要面對的損失或失控感。因此你傾向求助外界（算命、親友），其實是想給內心尋求一份溫柔的安全感。",
      warmNotes: "你的敏感與慎重，代表你非常珍惜自己的人生。但請別忘記，即使選了一條看起來比較崎嶇的路，那沿途也有屬於你的獨家風景。相信你的直覺，你遠比自己想像中更勇敢！",
      books: [
        "<b>《失控的焦慮世代》</b>（強納森·海德特）— 剖析焦慮來源，重拾當下的內心平靜。",
        "<b>《別對每件事都有反應》</b>（枡野俊明）— 禪意練習，教你淡泊一點、允許自己放鬆。",
        "<b>《想哭就哭吧，你不需要那麼懂事》</b>（Peter Su）— 允許自己脆弱，擁抱真實的感受。"
      ]
    },
    C: {
      icon: "🏆",
      tag: "欲望發散型",
      title: "【聖杯七】",
      psychology: "你的選擇困難是因為「每一個選項都很誘人」！你擁有一顆充滿好奇心與浪漫幻想的心，討厭被界定、討厭犧牲任何可能性。但當所有選項都擺在眼前時，你的焦點反而被分散了，最終導致精力被攤薄，甚至哪裡也去不了。",
      warmNotes: "什麼都想要，其實是渴望擁有一切的美好人生。但專注並不是放棄，而是『按順序體驗』。把你的慾望排個隊，一次專心品嚐一道菜，你會發現每一步都比以前更飽滿有成就感！",
      books: [
        "<b>《世界盡頭的咖啡館》</b>（約翰·史崔勒基）— 重新扣問存在價值，幫你找到核心優先順序。",
        "<b>《深度思考》</b>（莫林·希凱）— 香奈兒前 CEO 的成長洞察，教你專注真正有價值的事物。",
        "<b>《每一個人的花期不同》</b>（萬特特）— 專屬女性覺醒，學會在自己的節奏裡專注發光。"
      ]
    },
    D: {
      icon: "⚖️",
      tag: "關係和諧型",
      title: "【正義】",
      psychology: "你的選擇困難背後，藏著深層的「貼心與責任感」。你在做決定時，總是自帶一個雷達去掃描身邊人的感受，害怕自己的選擇會添麻煩、讓人失望或引來批評。你常常把『別人的需求』排在『自己真正想要』的前面。",
      warmNotes: "你總是照顧著大家的心情，但這次，請把溫柔留給自己。做決定不是為了讓全世界都滿意，而是為了對得起你自己的心。討好所有人是不可能的任務，但討好自己卻只要你一句話。",
      books: [
        "<b>《生命中最大的寶藏就是你自己》</b>（曾寶儀）— 學習向內探索，建立溫柔而堅定的人際界線。",
        "<b>《被討厭的勇氣》</b>（岸見一郎/古賀史健）— 劃清課題分離，擺脫他人期待的束縛。",
        "<b>《長女病：我們不是天生愛扛責任》</b>（心理學專著）— 解構負擔感，優雅放下不屬於你的期待。"
      ]
    }
  };

  let currentQuestion = 0;
  let scores = { A: 0, B: 0, C: 0, D: 0 };

  function startQuiz() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('question-text').innerText = q.q;
    
    const progress = ((currentQuestion + 1) / questions.length) * 100;
    document.getElementById('progress').style.width = `${progress}%`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(opt.type);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(type) {
    scores[type]++;
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    let highestType = 'A';
    let maxScore = -1;
    for (const type in scores) {
      if (scores[type] > maxScore) {
        maxScore = scores[type];
        highestType = type;
      }
    }

    const res = results[highestType];
    document.getElementById('result-icon').innerText = res.icon;
    document.getElementById('result-tag').innerText = res.tag;
    document.getElementById('result-title').innerText = res.title;
    document.getElementById('result-psychology').innerText = res.psychology;
    document.getElementById('result-warm-notes').innerText = res.warmNotes;

    const booksContainer = document.getElementById('result-books');
    booksContainer.innerHTML = '';
    res.books.forEach(bookStr => {
      const li = document.createElement('li');
      li.innerHTML = bookStr;
      booksContainer.appendChild(li);
    });
  }

  function restartQuiz() {
    currentQuestion = 0;
    scores = { A: 0, B: 0, C: 0, D: 0 };
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }
</script>

</body>
</html>
