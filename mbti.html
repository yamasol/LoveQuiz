<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 專屬你的 MBTI 深度性格探索 ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #fdfbf7;
            --text-color: #333333;
            --btn-bg: #ffe4e1;
            --btn-hover: #ffb6c1;
            /* 四大陣營背景色 */
            --color-nt: #f0e6ff; /* 分析家 淡紫 */
            --color-nf: #e6f7e6; /* 外交家 淡綠 */
            --color-sj: #e6f3ff; /* 守護者 淡藍 */
            --color-sp: #fffbe6; /* 探險家 淡黃 */
        }
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s ease;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
            padding: 28px 24px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 10px; color: #2c3e50; font-weight: 900; }
        p.subtitle { font-size: 14px; color: #7f8c8d; margin-top: 0; margin-bottom: 24px; }
        
        input[type="text"] {
            width: 85%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 16px;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        input[type="text"]:focus { border-color: #ffb6c1; }

        button {
            background-color: var(--btn-bg);
            border: none;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            color: #4a4a4a;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
            font-family: inherit;
        }
        button:hover { background-color: var(--btn-hover); transform: translateY(-2px); }
        .hidden { display: none !important; }

        .progress-bar-wrap {
            background-color: #f1f1f1;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: #ff6b81;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text { font-size: 13px; color: #95a5a6; margin-bottom: 12px; }

        /* 題目卡片 */
        .q-card {
            background: #fafafa;
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            border: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }
        .q-title { font-size: 17px; font-weight: 700; color: #2c3e50; margin-bottom: 8px; line-height: 1.4; }
        .q-scenario { font-size: 14px; color: #666; margin-bottom: 18px; line-height: 1.5; background: #fff; padding: 12px; border-radius: 12px; border-left: 4px solid #ff9ff3; }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .slider-labels .label-box {
            width: 48%;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #eee;
        }
        .slider-labels .right-box { text-align: right; }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: #ffe4e1;
            outline: none;
            margin: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ff6b81;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .score-display {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ff6b81;
            margin-top: 5px;
        }

        /* 結果頁面樣式 */
        .result-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            backdrop-filter: blur(5px);
        }
        .type-title { font-size: 46px; margin: 5px 0; font-weight: 900; letter-spacing: 2px; color: #2c3e50; }
        .type-name { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #555; }

        /* 分頁標籤 */
        .tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn {
            background: #f1f1f1;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            white-space: nowrap;
            margin-top: 0;
            width: auto;
            flex: 1;
        }
        .tab-btn.active { background: #ff6b81; color: #fff; box-shadow: 0 4px 10px rgba(255,107,129,0.25); }
        .tab-content { text-align: left; font-size: 14px; line-height: 1.7; min-height: 180px; display: none; color: #444; }
        .tab-content.active { display: block; }

        .evidence-item {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            font-size: 13px;
        }
        .evidence-title { font-weight: 700; color: #2c3e50; margin-bottom: 4px; }
        .evidence-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: #ffe4e1; color: #d63031; margin-top: 4px; }

        .action-btns { margin-top: 25px; display: flex; gap: 10px; }
        .action-btns button { font-size: 14px; padding: 12px; margin-top: 0; }
        .btn-danger { background-color: #ffe6e6; color: #c0392b; }
        .btn-danger:hover { background-color: #ffcccc; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 首頁區塊 -->
    <div id="screen-start">
        <h1>✨ 尋找你的 MBTI ✨</h1>
        <p class="subtitle">高共情情境題目 × 1~10 分彈性光譜測驗</p>
        <img src="https://api.iconify.design/noto:detective.svg" width="90" alt="detective" style="margin: 15px 0;">
        <br>
        <input type="text" id="userName" placeholder="請輸入你的暱稱（例如：小明）" autocomplete="off">
        <button onclick="startQuiz()">開始性格探索 🚀</button>
    </div>

    <!-- 2. 測驗區塊 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">問題 1 / 8</div>
        
        <div class="q-card">
            <div class="q-title" id="questionTitle">問題載入中...</div>
            <div class="q-scenario" id="questionScenario">情境載入中...</div>
            
            <div class="slider-labels">
                <div class="label-box" id="labelLeft">偏向左側</div>
                <div class="label-box right-box" id="labelRight">偏向右側</div>
            </div>
            
            <input type="range" id="scoreSlider" min="1" max="10" value="5" oninput="updateScoreDisplay(this.value)">
            <div class="score-display">選擇強度：<span id="scoreNum">5</span> 分</div>
        </div>

        <button onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <!-- 3. 結果區塊 -->
    <div id="screen-result" class="hidden">
        <h2 id="resultGreeting" style="font-size:20px; margin-bottom:5px;"></h2>
        <div class="result-card">
            <div class="type-title" id="mbtiType">INTJ</div>
            <div class="type-name" id="mbtiName">分析師</div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('desc', event)">📖 深度特質</button>
                <button class="tab-btn" onclick="switchTab('analysis', event)">⚖️ 優勢與盲點</button>
                <button class="tab-btn" onclick="switchTab('advice', event)">💡 成長建議</button>
                <button class="tab-btn" onclick="switchTab('career', event)">💼 推薦職業</button>
                <button class="tab-btn" onclick="switchTab('evidence', event)">🔍 答題佐證</button>
            </div>
            
            <div id="tab-desc" class="tab-content active"></div>
            <div id="tab-analysis" class="tab-content"></div>
            <div id="tab-advice" class="tab-content"></div>
            <div id="tab-career" class="tab-content"></div>
            <div id="tab-evidence" class="tab-content"></div>
        </div>
        
        <div class="action-btns">
            <button onclick="restartQuiz()">再測一次 🔄</button>
            <button class="btn-danger" onclick="clearCookieAndReset()">清除資料 🗑️</button>
        </div>
    </div>
</div>

<script>
    // 8 道具備高共鳴度的情境題庫
    const questions = [
        {
            title: "【社交充電模式】",
            scenario: "經歷了連續一整天充滿高壓會議與社交的大專案發表後，終於到了週五晚上：",
            left: "<b>1~5 分：獨處恢復</b><br>想一個人待在家追劇、玩遊戲或躺平，不說話才能把電充滿。(I)",
            right: "<b>6~10 分：聚會釋放</b><br>想約朋友熱炒、酒吧喝酒聊天，透過傾訴與熱鬧來紓解壓力。(E)",
            leftTrait: "I", rightTrait: "E", keyName: "社交能量來源"
        },
        {
            title: "【接收新資訊的方向】",
            scenario: "當你準備學習一項完全未知的技術或新領域時，你習慣從何處入手？",
            left: "<b>1~5 分：實事求是</b><br>希望先看到具體範例、操作步驟與過往成功案例，按部就班經驗累積。(S)",
            right: "<b>6~10 分：洞察願景</b><br>想先理解背後的整體理論、核心概念與未來可能的創新應用場景。(N)",
            leftTrait: "S", rightTrait: "N", keyName: "資訊接收習慣"
        },
        {
            title: "【面對朋友訴苦的反應】",
            scenario: "好友工作遭遇極大不公，非常挫折地向你傾訴遭遇時，你的第一直覺是：",
            left: "<b>1~5 分：理性剖析</b><br>幫他客觀分析問題癥結，釐清責任歸屬並試圖提出具體解決方案。(T)",
            right: "<b>6~10 分：情感共鳴</b><br>先站在他的立場同理情緒、安撫心情，讓他感受到被無條件支持。(F)",

        },
        {
            title: "【旅行與生活規劃】",
            scenario: "離期待已久的長途旅行只剩最後三天，你的準備狀態通常是：",
            left: "<b>1~5 分：結構嚴謹</b><br>行程表已排好時間點、交通接駁與備案，確保萬無一失才有安全感。(J)",
            right: "<b>6~10 分：隨興隨心</b><br>只訂好機票與住宿，具體要逛什麼到了當地隨興探索，享受意外驚喜。(P)",
            leftTrait: "J", rightTrait: "P", keyName: "生活結構與計畫"
        },
        {
            title: "【派對場合的互動】",
            scenario: "受邀參加一個有多位半熟不熟朋友的社交聚會時：",
            left: "<b>1~5 分：深交觀察</b><br>傾向待在熟人身邊，或是默默在旁觀察，當個溫和的聆聽者。(I)",
            right: "<b>6~10 分：破冰開場</b><br>隨性穿梭在人群間，主動找新朋友開啟話題，帶動現場氛圍。(E)",
            leftTrait: "I", rightTrait: "E", keyName: "社交主動性"
        },
        {
            title: "【介紹作品與分享經驗】",
            scenario: "向別人推薦一部你非常喜歡的電影或書籍時，你講話的重點往往是：",
            left: "<b>1~5 分：細節描繪</b><br>精準描述精彩對白、演員演技、畫面美學與具體情節發展。(S)",
            right: "<b>6~10 分：寓意探討</b><br>強調作品背後的哲學思考、隱喻象徵以及帶給你的深刻人生啟發。(N)",
            leftTrait: "S", rightTrait: "N", keyName: "表達與焦點"
        },
        {
            title: "【團隊決策爭議】",
            scenario: "團隊在討論重要決策各持己見，場面陷於僵局時，你傾向支持：",
            left: "<b>1~5 分：效益導向</b><br>回歸數據與客觀邏輯，選出最符合效益與效率的方案，哪怕會傷及人情。(T)",
            right: "<b>6~10 分：和諧導向</b><br>考量決策對團隊成員的情緒影響，尋求照顧各方感受的折衷共識。(F)",
            leftTrait: "T", rightTrait: "F", keyName: "價值判斷取向"
        },
        {
            title: "【面對死線（Deadline）】",
            scenario: "面對一個耗時一個月的大型專案或任務時，你的推進步調是：",
            left: "<b>1~5 分：按部就班</b><br>拆解成每週小目標推進，極度討厭最後一刻壓線的焦慮感。(J)",
            right: "<b>6~10 分：壓線爆發</b><br>前期花時間醞釀與嘗試多種可能，最後關頭在壓力下爆發驚人靈感。(P)",
            leftTrait: "J", rightTrait: "P", keyName: "工作節奏與執行力"
        }
    ];

    // 16型人格資料庫 (擴充篇幅)
    const mbtiData = {
        "INTJ": { 
            name: "建築師 / 獨立思考者", group: "NT", 
            desc: "你擁有極強的邏輯思考力與遠見，總是能以宏觀的視野看待事物。你討厭沒有效率與缺乏邏輯的制度，喜歡追求知識與自我提升。在他人眼中，你冷靜、獨立且具備極高執行力。", 
            analysis: "<b>【優勢】</b> 卓越的策略規劃能力、專注力強、極度獨立不隨波逐流。<br><b>【盲點】</b> 容易對缺乏效率的人失去耐心，有時過於批判或忽視情感需求。",
            advice: "學習接受現實中的不完美與混沌，多傾聽身邊人的情感聲音，適度放鬆嚴格的標準。",

            analysis: "<b>【優勢】</b> 深刻的邏輯分析能力、富創造力、不受傳統框架約束。<br><b>【盲點】</b> 容易陷入過度思考（Analysis Paralysis），執行力有時跟不上點子發想的速度。",

        },
        "ENTJ": { 
            name: "指揮官 / 領航者", group: "NT",

    let currentQuestionIndex = 0;
    let userName = "";
    let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    let userHistory = []; // 紀錄用戶作答歷程

    // 檢查 Cookie (localStorage)
    window.onload = function() {
        const savedName = localStorage.getItem("mbti_v2_name");
        const savedResult = localStorage.getItem("mbti_v2_result");
        const savedHistory = localStorage.getItem("mbti_v2_history");
        
        if (savedName && savedResult && savedHistory) {
            userName = savedName;
            userHistory = JSON.parse(savedHistory);
            showResult(savedResult);
        }
    };

    function startQuiz() {
        const nameInput = document.getElementById("userName").value.trim();
        if (!nameInput) {
            alert("請先輸入您的暱稱喔！");
            return;
        }
        userName = nameInput;
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            calculateResult();
            return;
        }
        const q = questions[currentQuestionIndex];
        
        // 更新進度條
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById("progressFill").style.width = `${progressPercent}%`;
        document.getElementById("progressText").innerText = `問題 ${currentQuestionIndex + 1} / ${questions.length}`;
        
        document.getElementById("questionTitle").innerText = q.title;
        document.getElementById("questionScenario").innerText = q.scenario;
        document.getElementById("labelLeft").innerHTML = q.left;
        document.getElementById("labelRight").innerHTML = q.right;
        
        // 重置 Slider
        document.getElementById("scoreSlider").value = 5;
        updateScoreDisplay(5);
    }

    function updateScoreDisplay(val) {
        document.getElementById("scoreNum").innerText = val;
    }

    function nextQuestion() {
        const val = parseInt(document.getElementById("scoreSlider").value);
        const q = questions[currentQuestionIndex];
        
        let chosenTrait = "";
        let weight = 0;

        if (val <= 5) {
            chosenTrait = q.leftTrait;
            weight = (6 - val);
            scores[q.leftTrait] += weight;
        } else {
            chosenTrait = q.rightTrait;
            weight = (val - 5);
            scores[q.rightTrait] += weight;
        }

        // 保存歷史資料供後續佐證分析
        userHistory.push({
            title: q.title,
            keyName: q.keyName,
            score: val,
            chosenTrait: chosenTrait,
            weight: weight,
            leftTrait: q.leftTrait,
            rightTrait: q.rightTrait
        });

        currentQuestionIndex++;
        loadQuestion();
    }

    function calculateResult() {
        let result = "";
        result += (scores.E >= scores.I) ? "E" : "I";
        result += (scores.S >= scores.N) ? "S" : "N";
        result += (scores.T >= scores.F) ? "T" : "F";
        result += (scores.J >= scores.P) ? "J" : "P";
        
        localStorage.setItem("mbti_v2_name", userName);
        localStorage.setItem("mbti_v2_result", result);
        localStorage.setItem("mbti_v2_history", JSON.stringify(userHistory));
        
        showResult(result);
    }

    function showResult(type) {
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-result").classList.remove("hidden");
        
        const data = mbtiData[type] || mbtiData["INTJ"];
        
        document.getElementById("resultGreeting").innerText = `🎉 嗨，${userName}！你的探索結果出爐：`;
        document.getElementById("mbtiType").innerText = type;
        document.getElementById("mbtiName").innerText = data.name;
        
        document.getElementById("tab-desc").innerHTML = data.desc;
        document.getElementById("tab-analysis").innerHTML = data.analysis;
        document.getElementById("tab-advice").innerHTML = data.advice;
        document.getElementById("tab-career").innerHTML = data.career;

        // 生成答題佐證選單
        generateEvidenceTab(type);

        // 背景動態變色
        const bodyStyle = document.body.style;
        if(data.group === "NT") bodyStyle.backgroundColor = "var(--color-nt)";
        if(data.group === "NF") bodyStyle.backgroundColor = "var(--color-nf)";
        if(data.group === "SJ") bodyStyle.backgroundColor = "var(--color-sj)";
        if(data.group === "SP") bodyStyle.backgroundColor = "var(--color-sp)";
    }

    function generateEvidenceTab(finalType) {
        const container = document.getElementById("tab-evidence");
        if (!userHistory || userHistory.length === 0) {
            container.innerHTML = "尚無答題紀錄可供佐證。";
            return;
        }

        let html = `<p style="font-size:13px; color:#666; margin-top:0;">以下是你剛才在測驗中的選擇，這些數據直接勾勒出了你的 <b>${finalType}</b> 人格特質：</p>`;
        
        userHistory.forEach((item, index) => {
            const traitFullNames = {
                "E": "外向 (Extraversion)", "I": "內向 (Introversion)",
                "S": "實感 (Sensing)", "N": "直覺 (Intuition)",
                "T": "思考 (Thinking)", "F": "情感 (Feeling)",
                "J": "判斷 (Judging)", "P": "感知 (Perceiving)"
            };

            let tendencyText = item.score <= 5 ? `偏向左側 (${item.score}分)` : `偏向右側 (${item.score}分)`;
            
            html += `
                <div class="evidence-item">
                    <div class="evidence-title">${index + 1}. ${item.title}</div>
                    <div>選擇程度：<b>${item.score} / 10 分</b> （${tendencyText}）</div>
                    <div class="evidence-tag">支持特質：${traitFullNames[item.chosenTrait]} (+${item.weight}分)</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function switchTab(tabId, event) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        userHistory = [];
        document.body.style.backgroundColor = "var(--primary-bg)";
        document.getElementById("screen-result").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        loadQuestion();
    }

    function clearCookieAndReset() {
        localStorage.removeItem("mbti_v2_name");
        localStorage.removeItem("mbti_v2_result");
        localStorage.removeItem("mbti_v2_history");
        userName = "";
        currentQuestionIndex = 0;
        scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        userHistory = [];
        
        document.getElementById("userName").value = "";
        document.body.style.backgroundColor = "var(--primary-bg)";
        document.getElementById("screen-result").classList.add("hidden");
        document.getElementById("screen-start").classList.remove("hidden");
        
        alert("歷史紀錄已成功清除！可以重新開始測驗囉 🧹");
    }
</script>
