<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fff8ef" />
<title>今天要吃什麼？｜可愛選擇器</title>
<style>
  :root{
    --bg:#fff8ef;
    --card:#fffdf9;
    --ink:#332e2a;
    --muted:#8d8177;
    --accent:#ff8fa3;
    --accent2:#ffcc7a;
    --accent3:#9ed8c5;
    --line:#f0dfcf;
    --shadow:0 10px 30px rgba(109,77,44,.10);
    --radius:24px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fffaf3 0%,#fff7ee 48%,#fffdf9 100%); color:var(--ink); min-height:100vh;
  }
  button{font:inherit}
  .wrap{width:min(680px,100%);margin:0 auto;padding:18px 16px 32px}
  .hero{padding:8px 4px 18px;text-align:center;position:relative}
  .spark{position:absolute;font-size:18px;animation:float 3s ease-in-out infinite}
  .spark.s1{left:8%;top:16px}.spark.s2{right:10%;top:42px;animation-delay:.8s}.spark.s3{left:17%;bottom:8px;animation-delay:1.4s}
  .eyebrow{display:inline-flex;gap:7px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 5px 14px rgba(90,60,30,.05);font-size:12px;color:#806f63}
  h1{font-size:34px;line-height:1.1;margin:13px 0 7px;letter-spacing:-1.2px}
  .subtitle{font-size:14px;color:var(--muted);margin:0 auto;max-width:420px;line-height:1.7}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f7ecdf;border:1px solid var(--line);padding:5px;border-radius:18px;position:sticky;top:10px;z-index:10;backdrop-filter:blur(10px)}
  .tab{border:0;background:transparent;color:#8d7d70;padding:12px 8px;border-radius:14px;font-weight:800;cursor:pointer;transition:.25s}
  .tab.active{background:#fff;box-shadow:0 5px 16px rgba(91,61,35,.08);color:var(--ink)}
  .panel{display:none;animation:fade .35s ease}.panel.active{display:block}
  .card{background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
  .section-title{font-size:18px;font-weight:900;margin:0 0 5px}.section-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px}

  /* Decision tree */
  .progress{height:8px;background:#f5e7d9;border-radius:999px;overflow:hidden;margin:10px 0 17px}.progress > i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--accent),#ffb36e);border-radius:999px;transition:.35s}
  .round{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.round-badge{font-size:12px;font-weight:900;color:#b76376;background:#fff0f3;border-radius:999px;padding:7px 10px}.round-tip{font-size:12px;color:var(--muted)}
  .question{font-size:23px;font-weight:950;line-height:1.35;text-align:center;margin:10px 8px 18px;letter-spacing:-.5px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{border:1px solid var(--line);background:#fff;border-radius:20px;padding:19px 12px;cursor:pointer;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .18s,box-shadow .18s,border-color .18s;background-image:radial-gradient(circle at 20% 0%,#fff8e8 0,transparent 38%)}
  .choice:active{transform:scale(.97)}.choice:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(95,62,36,.09);border-color:#ecc8ae}
  .choice .emoji{font-size:34px}.choice strong{font-size:16px}.choice small{font-size:11px;color:var(--muted)}
  .tiny-row{display:flex;justify-content:center;gap:7px;margin-top:14px}.dot{width:7px;height:7px;border-radius:99px;background:#ecdccf}.dot.on{background:var(--accent)}
  .result{display:none;text-align:center}.result.show{display:block;animation:pop .45s ease}.result .food-emoji{font-size:70px;line-height:1;margin:4px 0 8px}.result h2{font-size:27px;margin:0}.result .reason{font-size:13px;color:var(--muted);line-height:1.7;margin:9px auto 15px;max-width:440px}
  .tagline{display:inline-flex;gap:6px;background:#f3f9f5;color:#5e8574;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;margin-bottom:15px}
  .cta-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:900;cursor:pointer}.btn.primary{background:#ff9caf;color:#fff;box-shadow:0 8px 18px rgba(255,143,163,.25)}.btn.secondary{background:#f7eee6;color:#6f6157}

  /* Wheel */
  .wheel-wrap{position:relative;width:min(330px,86vw);margin:18px auto 10px;aspect-ratio:1}
  #wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 13px 17px rgba(80,51,25,.12));transition:transform 4s cubic-bezier(.14,.75,.18,1)}
  .pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #4b4039;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:7px solid #ffe0bf;display:grid;place-items:center;font-size:25px;box-shadow:0 6px 12px rgba(80,51,25,.12);z-index:2}
  .spin-btn{display:block;margin:2px auto 10px;width:min(260px,80%);border:0;border-radius:18px;padding:15px;background:linear-gradient(135deg,#ff99ad,#ffbe83);color:#fff;font-weight:950;font-size:17px;box-shadow:0 12px 24px rgba(255,144,158,.24);cursor:pointer}.spin-btn:disabled{opacity:.55;cursor:not-allowed}
  .wheel-hint{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 0}
  .wheel-result{display:none;text-align:center;padding-top:6px}.wheel-result.show{display:block;animation:pop .45s ease}.picked{display:inline-flex;align-items:center;gap:9px;background:#fff4df;border:1px solid #f0d7ad;border-radius:999px;padding:9px 13px;font-weight:900}.picked b{font-size:23px}
  .food-list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:15px}.food-chip{font-size:11px;color:#776b61;background:#faf4ed;border:1px solid #efe3d7;padding:6px 8px;border-radius:999px}

  .footer{padding:22px 5px 0;text-align:center;color:#9a8d82;font-size:11px;line-height:1.7}.footer strong{color:#76675c}
  .reset-link{background:none;border:0;color:#a07262;text-decoration:underline;cursor:pointer;font-size:12px;padding:5px}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(5deg)}}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
  @media (max-width:390px){h1{font-size:29px}.question{font-size:21px}.choice{min-height:106px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="spark s1">🍡</span><span class="spark s2">✨</span><span class="spark s3">🥢</span>
    <div class="eyebrow">🍴 今日份選擇障礙處理中心</div>
    <h1>今天到底要吃什麼？</h1>
    <p class="subtitle">不用想太久。讓我幫你從「你的心情」一路選到「你的晚餐」。</p>
  </header>

  <nav class="tabs" aria-label="模式切換">
    <button class="tab active" data-tab="tree">🌱 五關決策樹</button>
    <button class="tab" data-tab="wheel">🎡 命運轉盤</button>
  </nav>

  <section id="tree" class="panel active">
    <div class="card">
      <div class="round"><span class="round-badge" id="roundBadge">第 1 關／共 5 關</span><span class="round-tip">越直覺，答案越準 😎</span></div>
      <div class="progress"><i id="progressBar"></i></div>
      <div id="questionView">
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div class="tiny-row" id="dots"></div>
      </div>
      <div class="result" id="treeResult">
        <div class="tagline" id="resultTag">🎯 今日命中你的胃</div>
        <div class="food-emoji" id="resultEmoji">🍜</div>
        <h2 id="resultFood">滷肉飯</h2>
        <p class="reason" id="resultReason"></p>
        <div class="cta-row"><button class="btn primary" id="againBtn">再算一次 🔄</button><button class="btn secondary" id="jumpWheel">不服？轉盤決勝 🎡</button></div>
      </div>
    </div>
  </section>

  <section id="wheel" class="panel">
    <div class="card">
      <h2 class="section-title">🎡 命運轉盤</h2>
      <p class="section-desc">把「都可以」交給命運。這裡放了台北街頭常見、下班後相對好取得的平民美食。</p>
      <div class="wheel-wrap">
        <canvas id="wheelCanvas" width="700" height="700" aria-label="美食轉盤"></canvas>
        <div class="pointer"></div><div class="hub">🍴</div>
      </div>
      <button class="spin-btn" id="spinBtn">開始轉！今天吃這個 🎉</button>
      <p class="wheel-hint">小技巧：先深呼吸，再按下去。禁止反悔 10 秒 🤭</p>
      <div class="wheel-result" id="wheelResult"><div class="picked"><b id="pickedEmoji">🍜</b><span>命運指定：<span id="pickedFood">滷肉飯</span></span></div></div>
      <div class="food-list" id="foodList"></div>
    </div>
  </section>

  <footer class="footer">
    <div>Made with 🍚 + ☕ + 一點選擇困難</div>
    <div><strong>作者：睡覺的紅豬</strong> ｜ 製作工具：ChatGPT（GPT-5.6 Luna）＋ HTML / CSS / JavaScript</div>
    <button class="reset-link" id="resetAll">把一切恢復原廠設定</button>
  </footer>
</div>

<script>
(() => {
  const foods = [
    {name:'滷肉飯',emoji:'🍚'},{name:'雞排',emoji:'🍗'},{name:'牛肉麵',emoji:'🍜'},{name:'鍋燒麵',emoji:'🍲'},
    {name:'鹽酥雞',emoji:'🍟'},{name:'蚵仔煎',emoji:'🦪'},{name:'臭豆腐',emoji:'🧈'},{name:'水餃',emoji:'🥟'},
    {name:'牛肉湯',emoji:'🥣'},{name:'排骨飯',emoji:'🍖'},{name:'炒飯',emoji:'🍳'},{name:'炒麵',emoji:'🍝'},
    {name:'雞肉飯',emoji:'🍗'},{name:'麵線',emoji:'🍜'},{name:'燒臘飯',emoji:'🍱'},{name:'咖哩飯',emoji:'🍛'},
    {name:'日式拉麵',emoji:'🍜'},{name:'韓式拌飯',emoji:'🍚'},{name:'蔥抓餅',emoji:'🥞'},{name:'胡椒餅',emoji:'🥯'}
  ];

  const decisionTree = [
    {q:'現在的你，比較想要哪一種療癒？',opts:[['🍚','飽到心情好','想吃正餐、來點踏實的'],['🍟','爽到就對了','想吃香、脆、濃郁或邪惡一點的']]},
    {q:'你今晚的飢餓值大概幾分？',opts:[['🐣','5～7 分','正常餓，吃剛剛好'],['🐯','8～10 分','我可以吞下一頭牛！']]},
    {q:'你願意為今晚花多少？',opts:[['💰','平價派','100～180 元最舒服'],['💎','犒賞派','今天多花一點也可以']]},
    {q:'吃東西時，你現在想要哪個感覺？',opts:[['🥢','慢慢吃','坐下來好好吃一餐'],['🏃','快速解決','外帶、邊走邊吃也 OK']]},
    {q:'最後一題：現在最想要哪一派？',opts:[['🌶️','重口味','我要香、辣、鹹、過癮！'],['🌿','舒服派','清爽、溫暖、順口就好']]}
  ];

  const outcomeMap = {
    '00000':['雞肉飯','🍗','今天適合一份平價又有安全感的主食：雞肉飯。'],
    '00001':['牛肉麵','🍜','有餓、有預算，而且想舒服地吃一碗，熱湯派勝出。'],
    '00010':['排骨飯','🍖','踏實、飽足、CP 值在線，今天就是便當系答案。'],
    '00011':['滷肉飯','🍚','不用想太多，滷肉飯就是「今天先好好吃飯」的代表。'],
    '00100':['燒臘飯','🍱','今天值得升級一下，燒臘飯是平價犒賞系的穩牌。'],
    '00101':['日式拉麵','🍜','想獎勵自己又不想太浮誇？熱呼呼的一碗剛剛好。'],
    '00110':['咖哩飯','🍛','香濃、滿足、吃完有被安慰到的感覺。'],
    '00111':['韓式拌飯','🍚','想吃得有變化又要夠爽，這題交給韓式拌飯。'],
    '01000':['鍋燒麵','🍲','餓但想舒服吃，鍋燒麵的熱呼呼是今晚的答案。'],
    '01001':['牛肉湯','🥣','大餓模式啟動，來碗牛肉湯補充幸福值。'],
    '01010':['炒飯','🍳','便宜、快、飽，餓到發抖就先吃炒飯。'],
    '01011':['牛肉麵','🍜','又餓又想坐下來好好吃，牛肉麵勝率超高。'],
    '01100':['排骨飯','🍖','平價中的豪華感，今天就讓排骨補一下士氣。'],
    '01101':['雞排','🍗','高飢餓＋想快速解決：大雞排出場！'],
    '01110':['燒臘飯','🍱','餓到 8 分以上，就該拿一盒紮實的燒臘飯。'],
    '01111':['鹽酥雞','🍟','今天就是想爽一波，鹽酥雞懂你的胃。'],
    '10000':['蔥抓餅','🥞','想吃香香脆脆又不用坐太久，蔥抓餅很可以。'],
    '10001':['胡椒餅','🥯','外帶方便、熱熱吃超香，今晚走街頭美食路線。'],
    '10010':['水餃','🥟','簡單、好吃、份量好掌握，水餃是選擇困難的安全牌。'],
    '10011':['鍋燒麵','🍲','想吃舒服熱食又快速，鍋燒麵給你一個溫暖收尾。'],
    '10100':['蚵仔煎','🦪','今天想來點台味又有夜市感，蚵仔煎很適合。'],
    '10101':['臭豆腐','🧈','想要強烈存在感？臭豆腐直接把「過癮」拉滿。'],
    '10110':['炒麵','🍝','快速、香、飽，逛街走累了就吃這個。'],
    '10111':['雞排','🍗','今晚拒絕清淡，雞排就是最直接的幸福。'],
    '11000':['水餃','🥟','小吃派、坐下來慢慢吃，水餃好取得又很穩。'],
    '11001':['牛肉麵','🍜','今天需要一點熱湯與麵的安慰，牛肉麵來了。'],
    '11010':['咖哩飯','🍛','香濃系療癒擔當，吃一口就比較不想生氣了。'],
    '11011':['日式拉麵','🍜','值得犒賞一下自己，就用一碗拉麵收工。'],
    '11100':['鹽酥雞','🍟','重口味＋快速解決＝鹽酥雞，公式很漂亮。'],
    '11101':['雞排','🍗','今天不需要大道理，需要的是一塊脆脆的雞排。'],
    '11110':['臭豆腐','🧈','重口味想吃得有個性，臭豆腐直接過關。'],
    '11111':['蚵仔煎','🦪','夜市靈魂上線，台味、香氣與罪惡感一次到位。']
  };

  // Tabs
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active'); document.getElementById(btn.dataset.tab).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }));

  // Decision tree
  let round=0, answers=[];
  const qEl=document.getElementById('question'), choicesEl=document.getElementById('choices'), dotsEl=document.getElementById('dots');
  const resultEl=document.getElementById('treeResult'), progress=document.getElementById('progressBar');
  function renderDecision(){
    if(round>=decisionTree.length){ showTreeResult(); return; }
    const item=decisionTree[round];
    document.getElementById('roundBadge').textContent=`第 ${round+1} 關／共 5 關`;
    document.querySelector('.round-tip').textContent = ['先憑直覺','感受一下你的胃','錢包 OK 嗎？','想坐下還是快吃？','最後一票！'][round];
    progress.style.width=((round+1)/5*100)+'%'; qEl.textContent=item.q; choicesEl.innerHTML=''; dotsEl.innerHTML='';
    for(let i=0;i<5;i++){const d=document.createElement('i');d.className='dot '+(i<=round?'on':'');dotsEl.appendChild(d)}
    item.opts.forEach((o,idx)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="emoji">${o[0]}</span><strong>${o[1]}</strong><small>${o[2]}</small>`;b.onclick=()=>{answers.push(idx);round++;renderDecision()};choicesEl.appendChild(b)});
  }
  function showTreeResult(){
    document.getElementById('questionView').style.display='none'; resultEl.classList.add('show');
    const key=answers.join(''); const fallback=['滷肉飯','🍚','這是綜合你的飢餓、預算與當下口味後的安全牌。'];
    const r=outcomeMap[key]||fallback;
    document.getElementById('resultEmoji').textContent=r[1]; document.getElementById('resultFood').textContent=r[0]; document.getElementById('resultReason').textContent=r[2];
    progress.style.width='100%'; document.getElementById('roundBadge').textContent='🎉 五關完成';
  }
  document.getElementById('againBtn').onclick=()=>{round=0;answers=[];resultEl.classList.remove('show');document.getElementById('questionView').style.display='block';renderDecision();};
  document.getElementById('jumpWheel').onclick=()=>document.querySelector('[data-tab="wheel"]').click();
  renderDecision();

  // Wheel
  const canvas=document.getElementById('wheelCanvas'),ctx=canvas.getContext('2d');
  const N=foods.length, cx=350, cy=350, radius=333, slice=2*Math.PI/N;
  const palette=['#FFD6A5','#FDFFB6','#CAFFBF','#9BF6FF','#A0C4FF','#BDB2FF','#FFC6FF','#FFADAD'];
  function drawWheel(){
    ctx.clearRect(0,0,700,700);
    for(let i=0;i<N;i++){
      const a0=-Math.PI/2+i*slice, a1=a0+slice;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,a0,a1);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+slice/2);ctx.textAlign='right';ctx.fillStyle='#4b4039';ctx.font='bold 20px system-ui';ctx.fillText(foods[i].name,radius-23,7);ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.stroke();
  }
  drawWheel();
  const wheelEl=canvas;
  let rotation=0,busy=false;
  document.getElementById('spinBtn').onclick=()=>{
    if(busy)return; busy=true; document.getElementById('spinBtn').disabled=true; document.getElementById('wheelResult').classList.remove('show');
    const winner=Math.floor(Math.random()*N);
    // Pointer is at top; make selected slice land under pointer.
    const target = 360 - (winner*(360/N) + (360/N)/2);
    rotation += 360*5 + target - ((rotation%360)+360)%360;
    wheelEl.style.transform=`rotate(${rotation}deg)`;
    setTimeout(()=>{
      const f=foods[winner];document.getElementById('pickedEmoji').textContent=f.emoji;document.getElementById('pickedFood').textContent=f.name;document.getElementById('wheelResult').classList.add('show');busy=false;document.getElementById('spinBtn').disabled=false;
    },4100);
  };
  const list=document.getElementById('foodList'); foods.forEach(f=>{const s=document.createElement('span');s.className='food-chip';s.textContent=f.emoji+' '+f.name;list.appendChild(s)});

  document.getElementById('resetAll').onclick=()=>{localStorage.removeItem('eatChoiceData');round=0;answers=[];document.getElementById('treeResult').classList.remove('show');document.getElementById('questionView').style.display='block';renderDecision();rotation=0;wheelEl.style.transform='rotate(0deg)';document.getElementById('wheelResult').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});};
})();
</script>
</body>
</html>
